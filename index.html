<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="body">
    <header class="header">
      <aside class="header__aside">
        <img class="header__img" src="./eisenhower-matrix.jpg" alt="Eisenhower-Matrix">
        <a
          class="header__link"
          href="https://goal-life.com/page/method/matrix-eisenhower"
        >
          Want more details?
        </a>
      </aside>
    </header>
    <main class="main">
      <section id="top-section" class="add">
        <h1 class="add__title title">Add Item</h1>
        <div class="add__row">
          <input id="new-task" class="add__input input-text" type="text">
          <button class="add__button button">Add</button>
        </div>
      </section>
      <section class="todo">
        <h2 class="todo__title title">Todo</h2>
        <ul id="incomplete-tasks" class="list">
          <li class="list__item">
            <input type="checkbox" class="input-checkbox">
            <label class="list__label label">Pay Bills</label>
            <input type="text" class="list__input-text input-text">
            <button class="button button--edit">Edit</button>
            <button class="button button--delete">
              <img src="./remove.svg" class="button__delete-icon" alt="Delete icon">
            </button>
          </li>
          <li class="list__item list__item--edit-mode">
            <input type="checkbox" class="input-checkbox">
            <label class="list__label label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="list__input-text input-text">
            <button class="button button--edit">Save</button>
            <button class="button button--delete">
              <img src="./remove.svg" class="button__delete-icon" alt="Delete icon">
            </button>
          </li>
        </ul>
      </section>
      <section class="completed">
        <h2 class="title">Completed</h2>
        <ul id="completed-tasks" class="list">
          <li class="list__item">
            <input type="checkbox" class="input-checkbox" checked>
            <label class="list__label label label--completed">See the Doctor</label>
            <input type="text" class="list__input-text input-text">
            <button class="button button--edit">Edit</button>
            <button class="button button--delete">
              <img src="./remove.svg" class="button__delete-icon" alt="Delete icon">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
